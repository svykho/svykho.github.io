<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0b0b0b;
      color: white;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    /* NAV IGUAL QUE EL RESTO */
    nav {
      display: flex;
      justify-content: flex-end;
      gap: 2rem;
      margin-bottom: 40px;
      font-size: 1.3rem;
      font-weight: 700;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f39c12;
    }

    /* TITULOS */
    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1rem;
      color: #ccc;
      margin-bottom: 30px;
    }

    /* GALERIA */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .gallery div {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gallery img {
      width: 100%;
      border-radius: 8px;
      transition: transform 0.3s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .gallery p {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #aaa;
      font-style: italic;
      text-align: center;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      nav {
        justify-content: center;
        font-size: 1rem;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="research.html">Research</a>
      <a href="cv.html">CV</a>
      <a href="gallery.html">Gallery</a>
    </nav>

    <h1>Gallery</h1>
    <p>Just to show you how beautiful Mallorca is :)</p>

    <div class="gallery">
      <div>
        <img src="images/mallorca.jpeg" alt="Mallorca">
        <p>Mallorca</p>
      </div>
      <div>
        <img src="images/calamajor.jpeg" alt="Cala Major">
        <p>Cala Major</p>
      </div>
      <div>
        <img src="images/formentor.jpeg" alt="Cap de Formentor">
        <p>Cap de Formentor</p>
      </div>
      <div>
        <img src="images/portsoller.jpg" alt="Port de Sóller">
        <p>Port de Sóller</p>
      </div>
    </div>

  </div>

</body>
</html>
