<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alejandro Svyatkovskyy Kholyavka</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* ✅ bloquea scroll */
    }

    body {
      font-family: 'Inter', sans-serif;
      color: white;
      background: url("images/wormhole.jpg") no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      height: 100dvh; /* ✅ mejor para móvil */
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* HEADER */
    header {
      padding: 30px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .branding {
      display: flex;
      flex-direction: column;
    }

    .branding .name {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .branding .subtitle {
      font-style: italic;
      font-size: 1rem;
      font-weight: 400;
    }

    nav {
      display: flex;
      gap: 2rem;
      font-weight: 700;
      font-size: 1.5rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #f39c12;
    }

    /* CENTER */
    .center {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* SOCIALS */
    .socials {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding-bottom: 20px;
    }

    .socials a {
      color: white;
      font-size: 1.8rem;
      text-decoration: none;
      transition: color 0.3s;
    }

    .socials a:hover {
      color: #f39c12;
    }

    /* MOBILE */
    @media (max-width: 768px) {

      header {
        flex-direction: column;
        gap: 10px;
      }

      .branding {
        align-items: center;
        text-align: center;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
        font-size: 1rem;
      }

      .socials {
        gap: 1rem;
      }

      .socials a {
        font-size: 1.5rem;
      }
    }

  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="branding">
        <div class="name">Alejandro Svyatkovskyy Kholyavka</div>
        <div class="subtitle">PhD student @ UIB</div>
      </div>

      <nav>
        <a href="about.html">About</a>
        <a href="research.html">Research</a>
        <a href="cv.html">CV</a>
        <a href="gallery.html">Gallery</a>
      </nav>
    </header>

    <div class="center">
      <!-- Puedes meter aquí texto si quieres -->
    </div>

    <div class="socials">
      <a href="https://github.com/svykho" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://www.linkedin.com/in/asvyatkovskyyk" target="_blank"><i class="fab fa-linkedin"></i></a>
      <a href="mailto:alejandro.svyatkovskyy@uib.cat"><i class="fas fa-envelope"></i></a>
      <a href="https://orcid.org/0009-0004-1688-6018" target="_blank"><i class="fab fa-orcid"></i></a>
      <a href="https://inspirehep.net/authors/3081611" target="_blank"><i class="fas fa-book"></i></a>
      <a href="https://portalinvestigacio.uib.cat/investigadores/2237820/detalle" target="_blank"><i class="fas fa-university"></i></a>
    </div>

  </div>

</body>
</html>
